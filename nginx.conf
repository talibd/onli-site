map $http_accept $webp_suffix {
    default "";
    "~image/webp" ".webp";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/octet-stream;

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Asset filenames are content-hashed, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve the smaller .webp copy (made by make-webp.py) when the browser supports it.
    location ~* ^/assets/.+\.(png|jpe?g)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept;
        try_files $uri$webp_suffix $uri =404;
    }

    error_page 404 /404.html;
}
