server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }

    error_page 404 /404.html;
}
